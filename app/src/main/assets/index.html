<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <title>PLC 学习助手</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
    <div class="brand">
        <span class="brand-mark">PLC</span>
        <h1>PLC 学习助手</h1>
    </div>
    <p class="app-meta">v<span id="app-version">--</span> · 离线版</p>
</header>

<main class="app-main">

    <section class="card" aria-labelledby="roadmap-title">
        <h2 id="roadmap-title">学习路线</h2>
        <p class="card-note">以下模块将在后续版本逐步开放。</p>
        <ul class="lesson-list">
            <li class="lesson lesson--pending">
                <span class="lesson-tag">V1.0</span>
                <span class="lesson-name">数字量基础：DI / DO</span>
                <span class="lesson-state">待开放</span>
            </li>
            <li class="lesson lesson--pending">
                <span class="lesson-tag">V1.0</span>
                <span class="lesson-name">模拟量基础：AI / AO</span>
                <span class="lesson-state">待开放</span>
            </li>
            <li class="lesson lesson--pending">
                <span class="lesson-tag">V1.0</span>
                <span class="lesson-name">常开 / 常闭（NO / NC）</span>
                <span class="lesson-state">待开放</span>
            </li>
            <li class="lesson lesson--pending">
                <span class="lesson-tag">V1.1</span>
                <span class="lesson-name">梯形图仿真</span>
                <span class="lesson-state">待开放</span>
            </li>
        </ul>
    </section>

    <section class="card" aria-labelledby="status-title">
        <h2 id="status-title">当前状态</h2>
        <p class="card-note">工程骨架已搭建完成，界面可离线运行；教学内容尚未实现。</p>
    </section>

</main>

<footer class="app-footer">
    <p>完全离线 · 不申请网络权限</p>
</footer>

<script src="js/app.js"></script>
</body>
</html>
